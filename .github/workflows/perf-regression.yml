name: Generation-time regression check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A relative check against a committed baseline (src/harness/perf-baseline.json),
      # at a fixed seed set (src/harness/perf-regression.sweep.json). Soft gate:
      # continue-on-error keeps a regression from blocking a merge, while still
      # showing as a failed step and writing the job summary below.
      - name: Run harness at fixed seeds and compare to baseline
        id: perf
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx src/harness/perfCheckCli.ts 2>&1 | tee "$RUNNER_TEMP/perf.log"

      - name: Report the soft-gate outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.perf.outcome }}" != "failure" ]; then
            exit 0
          fi
          # A setup failure — an unreadable spec or baseline, a bad threshold —
          # exits before anything reaches the summary, so point at the log
          # instead of at a summary that was never written.
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## Generation-time regression check"
              echo
              echo "The check exited before it could compare anything:"
              echo
              echo '```'
              tail -n 20 "$RUNNER_TEMP/perf.log" 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo
              echo "Soft gate: this does not block the merge. It is not the device measurement of the 1s target."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::warning::Generation-time regression check did not pass — see the job summary. This does not block the merge."
