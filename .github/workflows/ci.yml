name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: both jobs check out, run npm, and
# upload an artifact.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run budget

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Separate from `verify` so a browser failure is distinguishable from a unit
  # failure at a glance, and so a flaky runner cannot mask a red generator.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only. The other engines are ~400MB of download apiece and
      # nothing here is engine-specific: iOS Safari is covered on a phone, not
      # by WebKit on Linux.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and previews the bundle itself.
      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
