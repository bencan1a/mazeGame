name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Deploy any branch on demand: Actions -> Deploy to GitHub Pages ->
  # Run workflow -> pick the branch. Useful for checking an agent's work on a
  # real phone before merging. Note this replaces the live site until the next
  # push to main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a newer one supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages serves a project site from /<repo>/, so the bundle,
        # the service worker scope, and the manifest all need that prefix.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Report what shipped
        run: |
          echo "### Deployed \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find dist -name '*.js' -o -name '*.css' -o -name '*.html' | grep -v '\.map$' | sort | while read -r f; do
            echo "| \`${f#dist/}\` | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
