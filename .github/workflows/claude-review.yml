name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review at a time per PR; a new push cancels the review of the stale commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Job name doubles as the status-check context referenced by the ruleset.
    name: claude-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      # Fork PRs cannot read secrets, and drafts are not ready for review. Both are
      # guarded at the step level rather than the job level so the required status
      # check still reports success instead of hanging as "skipped".
      - name: Check out PR
        if: >-
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review and vote
        if: >-
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token is deliberately NOT set. Without it the action authenticates
          # as the Claude GitHub App, so the review is submitted by claude[bot]. An
          # approval from a GitHub App counts toward a required-approval rule;
          # an approval from github-actions[bot] (the default GITHUB_TOKEN) does not.
          additional_permissions: |
            actions: read
          prompt: |
            You are reviewing a pull request as a required reviewer. Your review
            decides whether this PR can merge, so be accurate rather than agreeable.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            ## Read first

            Read `REVIEW.md` — it holds the criteria you apply, what blocks versus
            what is a nit, and how to keep reviews cheap. Then read `CLAUDE.md`,
            `docs/WORKFLOW.md` (lane ownership and the contract-change rule), and
            `docs/CONTRACTS.md` (the invariants generator work must hold). Consult
            `docs/adr/` when a change looks like it cuts against a recorded decision.

            The PR branch is already checked out. Read the diff with `gh pr diff`,
            then read the surrounding files so you judge each change in context
            rather than from the diff hunk alone.

            Do not re-report anything CI settles. `npm run verify` gates format,
            lint, typecheck, tests, coverage, build, and bundle budget, and the
            `verify` check must be green for this PR to merge regardless of you.

            ## How to report

            1. For each specific issue, post an inline comment on the exact line
               using `mcp__github_inline_comment__create_inline_comment` with
               `confirmed: true`. Prefix each one with `BLOCKING:` or `Nit:`.
            2. Then submit exactly one review verdict:

               If you found NO blocking issues:
                 gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve --body "<summary>"

               If you found ONE OR MORE blocking issues:
                 gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --request-changes --body "<summary>"

            The summary body should open with a one-line tally, for example
            `1 blocking, 3 nits`, followed by a short paragraph on what the PR does
            and what you checked. Keep it to a few sentences.

            ## Rules

            - Submit the verdict exactly once. Never submit both.
            - Approve only when you genuinely found nothing blocking. An approval is
              a merge authorization, not a courtesy.
            - If the PR author is `claude` or a bot that authored this branch, GitHub
              will reject a self-review. In that case skip the verdict and post your
              findings with `gh pr comment` instead, noting that a human must approve.
            - If `gh pr review` fails, do not retry with a different verdict. Post the
              error and your findings with `gh pr comment`.
            - Report only through GitHub comments. Do not put the review in your
              final message.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
