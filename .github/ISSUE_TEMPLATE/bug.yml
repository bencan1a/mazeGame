name: Bug
description: Something is wrong
labels: []
body:
  - type: input
    id: seed
    attributes:
      label: Seed and params
      description: Boards are pure functions of (seed, params) — this makes it reproducible.
      placeholder: 'seed 4211, 40x40, meanPieceLength 14'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: 'A fix starts with a failing test that reproduces this.'
